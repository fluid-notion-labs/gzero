[workspace]
resolver = "2"
members = [
    "systems/crates/gzero",
    "systems/crates/gzero-client",
    "systems/crates/gzero-ffi",
]

# Shared profile tuning can live here later; the crates keep their own
# package metadata. Target/ and Cargo.lock are shared at this root —
# relocating into the workspace dedupes dependency compilation that
# gzero-client/target and gzero-ffi/target used to repeat.

[profile.release]
# defaults are fine for now; no need to diverge from the old crate build
