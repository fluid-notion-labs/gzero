[package]
name = "gzero"
version = "0.1.0"
edition = "2021"
description = "Gzero: multiset of tagged agent instructions, pluggable storage"
license = "MIT"
readme = "README.md"

[[bin]]
name = "gzero"
path = "src/main.rs"

[lib]
name = "gzero"
path = "src/lib.rs"

[dependencies]
automerge = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
libc = "0.2"

[[bin]]
name = "gzero-mcp"
path = "src/bin/mcp.rs"
